<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Đăng nhập')}"></head>
<body>

<div class="login-split">
  <!-- Ảnh bên trái (trên điện thoại thành banner phía trên) -->
  <div class="login-photo">
    <img th:src="@{/images/login.jpg}" src="/images/login.jpg" alt="" width="900" height="1200">
    <div class="login-photo-text">
      <span class="brand">Bếp Việt</span>
      <p>Món Việt quen thuộc, nấu mới mỗi ngày.</p>
    </div>
  </div>

  <main id="main" class="login-form-side">
    <div class="login-box">
      <h1>Đăng nhập</h1>
      <p>Dùng tài khoản nhà hàng cấp cho bạn.</p>

      <div class="alert alert-danger" th:if="${error}" th:text="${error}" role="alert"></div>

      <form th:action="@{/login}" method="post">
        <div class="mb-3">
          <label for="username" class="form-label">Tên đăng nhập</label>
          <input id="username" name="username" class="form-control" autocomplete="username"
                 maxlength="50" required autofocus>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Mật khẩu</label>
          <input id="password" name="password" type="password" class="form-control"
                 autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-lg w-100" type="submit">Đăng nhập</button>
      </form>

      <!-- Tài khoản mẫu từ seed.json, chỉ để demo đồ án. -->
      <section class="demo-accounts" aria-labelledby="demoTitle">
        <h2 id="demoTitle">Tài khoản demo</h2>
        <table class="table table-sm mb-0">
          <tbody>
          <tr><td><code>owner</code> / <code>owner123</code></td><td>Chủ nhà hàng</td></tr>
          <tr><td><code>customer1</code> / <code>customer123</code></td><td>Khách</td></tr>
          <tr><td><code>customer2</code> / <code>customer123</code></td><td>Khách</td></tr>
          </tbody>
        </table>
      </section>
    </div>
  </main>
</div>

</body>
</html>
