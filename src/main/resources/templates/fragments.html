<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<!-- Phần <head> dùng chung: <head th:replace="~{fragments :: head('Tên trang')}"></head> -->
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="|${title} · Bếp Việt|">Bếp Việt</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body>

<!-- Thanh điều hướng. currentPath do PageAdvice đưa vào model để đánh dấu trang đang mở. -->
<header th:fragment="nav" class="site-header">
  <a class="skip-link" href="#main">Bỏ qua tới nội dung chính</a>
  <nav class="navbar navbar-expand-md container app-container" aria-label="Điều hướng chính">
    <a class="brand" th:href="@{/}">Bếp Việt</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#siteMenu"
            aria-controls="siteMenu" aria-expanded="false" aria-label="Mở menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="siteMenu">
      <ul class="navbar-nav me-auto"
          th:if="${currentUser != null and currentUser.role().name() == 'OWNER'}">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/owner/rag}"
             th:classappend="${currentPath == '/owner/rag'} ? 'active'"
             th:aria-current="${currentPath == '/owner/rag'} ? 'page'">Hỏi đáp</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/owner/feedback}"
             th:classappend="${currentPath == '/owner/feedback'} ? 'active'"
             th:aria-current="${currentPath == '/owner/feedback'} ? 'page'">Góp ý</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/owner/notes}"
             th:classappend="${currentPath == '/owner/notes'} ? 'active'"
             th:aria-current="${currentPath == '/owner/notes'} ? 'page'">Ghi chú</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/owner/persona}"
             th:classappend="${currentPath == '/owner/persona'} ? 'active'"
             th:aria-current="${currentPath == '/owner/persona'} ? 'page'">Giọng điệu</a>
        </li>
      </ul>

      <ul class="navbar-nav me-auto"
          th:if="${currentUser != null and currentUser.role().name() == 'CUSTOMER'}">
        <!-- Trang khách là một trang dài; menu nhảy tới từng phần -->
        <li class="nav-item"><a class="nav-link" th:href="@{/customer/chat#menu}">Thực đơn</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/customer/chat#assistant}">Trợ lý gọi món</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/customer/chat#feedback}">Góp ý</a></li>
      </ul>

      <div class="nav-user" th:if="${currentUser != null}">
        <span th:text="${currentUser.username()}">user</span>
        <form th:action="@{/logout}" method="post">
          <button class="btn btn-sm btn-outline-secondary" type="submit">Đăng xuất</button>
        </form>
      </div>
    </div>
  </nav>
</header>

<!-- Thông báo sau khi submit form (flash attribute "success" / "error"). -->
<div th:fragment="alerts" class="flash-area" aria-live="polite">
  <div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div>
  <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
</div>

</body>
</html>
