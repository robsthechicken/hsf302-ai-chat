<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Giọng điệu trợ lý')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>

<main id="main" class="container app-container page">
  <div th:replace="~{fragments :: alerts}"></div>

  <div class="page-header">
    <div>
      <h1>Giọng điệu trợ lý</h1>
      <p>Quy định cách trợ lý gọi món xưng hô và nói chuyện với khách.
        Các quy tắc về thực đơn và an toàn vẫn giữ nguyên.</p>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-8">
      <section class="panel" aria-labelledby="personaTitle">
        <div class="panel-head">
          <h2 id="personaTitle">Mô tả giọng điệu</h2>
        </div>
        <form class="panel-body" method="post" th:action="@{/owner/persona}">
          <label for="personaContent" class="form-label">Nội dung</label>
          <textarea id="personaContent" name="content" class="form-control" rows="8" maxlength="2000" required
                    aria-describedby="personaHelp" th:text="${persona}">Persona</textarea>
          <div id="personaHelp" class="form-text">
            Chỉ nên mô tả phong thái, cách xưng hô và từ ngữ. Tối đa 2000 ký tự.</div>
          <button class="btn btn-primary mt-3" type="submit">Lưu</button>
        </form>
      </section>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
