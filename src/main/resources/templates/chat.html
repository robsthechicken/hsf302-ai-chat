<!DOCTYPE html>
<!--
    Trang chat duy nhất, thuần HTML + Thymeleaf, không dùng JavaScript.
    Dữ liệu do ChatController gửi sang qua Model:
      - mode     : chế độ hiện tại (NORMAL / RAG)
      - messages : danh sách tin nhắn của chế độ đó
      - docs     : danh sách tài liệu đã upload (dùng cho RAG)
      - notice / error : thông báo sau khi upload (flash attribute)
-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Chat</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            margin: 0;
            background: #f4f5f7;
            color: #1f2933;
        }
        .page { max-width: 760px; margin: 0 auto; padding: 24px 16px 40px; }
        h1 { font-size: 22px; margin: 0 0 16px; }

        /* Nút chuyển chế độ */
        .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .tab {
            padding: 8px 16px; border-radius: 6px; text-decoration: none;
            border: 1px solid #c4cad2; background: #fff; color: #1f2933;
        }
        .tab.active { background: #1f4e79; border-color: #1f4e79; color: #fff; }
        .tab:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid #1f4e79; outline-offset: 2px; }

        .hint { font-size: 14px; color: #52606d; margin: 0 0 12px; }

        /* Khung upload (chỉ hiện ở RAG) */
        .panel { background: #fff; border: 1px solid #d9dde3; border-radius: 6px; padding: 12px 14px; margin-bottom: 16px; }
        .panel h2 { font-size: 15px; margin: 0 0 8px; }
        .panel form { display: inline-block; margin: 0 6px 6px 0; }
        .doc-list { margin: 8px 0 0; padding-left: 18px; font-size: 14px; }
        .empty { font-size: 14px; color: #7b8794; margin: 8px 0 0; }
        .notice { background: #e6f4ea; border: 1px solid #a8d5b5; color: #1e5631; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
        .error  { background: #fdecea; border: 1px solid #f1b0aa; color: #8a1f17; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }

        /* Khung chat */
        .chat { background: #fff; border: 1px solid #d9dde3; border-radius: 6px; padding: 16px; min-height: 240px; }
        .msg { margin-bottom: 14px; max-width: 85%; }
        .msg .who { font-size: 12px; color: #7b8794; margin-bottom: 2px; }
        .msg .bubble { padding: 10px 12px; border-radius: 8px; white-space: pre-wrap; line-height: 1.5; }
        .msg.user { margin-left: auto; }
        .msg.user .who { text-align: right; }
        .msg.user .bubble { background: #1f4e79; color: #fff; }
        .msg.ai .bubble { background: #eef1f5; }
        .msg.err .bubble { background: #fdecea; color: #8a1f17; }
        .sources { font-size: 12px; color: #52606d; margin: 6px 0 0; padding-left: 18px; }

        /* Ô nhập */
        .ask { display: flex; gap: 8px; margin-top: 16px; }
        .ask input[type=text] { flex: 1; padding: 10px 12px; border: 1px solid #c4cad2; border-radius: 6px; font-size: 15px; }
        button {
            padding: 9px 16px; border: 1px solid #1f4e79; background: #1f4e79; color: #fff;
            border-radius: 6px; cursor: pointer; font-size: 14px;
        }
        button.secondary { background: #fff; color: #1f4e79; }
        .footer-actions { margin-top: 10px; }
    </style>
</head>
<body>
<div class="page">
    <h1>AI Chat</h1>

    <!-- Chuyển chế độ: mỗi link là một GET /chat?mode=... -->
    <div class="tabs">
        <a class="tab" th:href="@{/chat(mode='NORMAL')}"
           th:classappend="${mode.name() == 'NORMAL'} ? 'active'">AI thường</a>
        <a class="tab" th:href="@{/chat(mode='RAG')}"
           th:classappend="${mode.name() == 'RAG'} ? 'active'">AI RAG</a>
    </div>

    <p class="hint" th:if="${mode.name() == 'NORMAL'}">
        AI thường: hỏi gì trả lời đó, không dùng tài liệu.
    </p>
    <p class="hint" th:if="${mode.name() == 'RAG'}">
        AI RAG: chỉ trả lời dựa trên các tài liệu bạn đã upload.
    </p>

    <div class="notice" th:if="${notice}" th:text="${notice}"></div>
    <div class="error" th:if="${error}" th:text="${error}"></div>

    <!-- Khung upload: chỉ hiện khi đang ở chế độ RAG -->
    <div class="panel" th:if="${mode.name() == 'RAG'}">
        <h2>Tài liệu</h2>
        <form th:action="@{/chat/upload}" method="post" enctype="multipart/form-data">
            <input type="file" name="file" accept=".txt" required>
            <button type="submit">Upload</button>
        </form>
        <form th:action="@{/chat/clear-docs}" method="post" th:if="${!docs.isEmpty()}">
            <button type="submit" class="secondary">Xoá hết tài liệu</button>
        </form>

        <ul class="doc-list" th:if="${!docs.isEmpty()}">
            <li th:each="d : ${docs}" th:text="${d.name + ' (' + d.chunks + ' đoạn)'}"></li>
        </ul>
        <p class="empty" th:if="${docs.isEmpty()}">Chưa có tài liệu. Upload file .txt để bắt đầu.</p>
    </div>

    <!-- Khung chat -->
    <div class="chat">
        <p class="empty" th:if="${messages.isEmpty()}">Chưa có tin nhắn. Nhập câu hỏi bên dưới.</p>

        <div th:each="m : ${messages}" class="msg"
             th:classappend="${m.fromUser} ? 'user' : (${m.error} ? 'ai err' : 'ai')">
            <div class="who" th:text="${m.fromUser} ? 'Bạn' : 'AI'"></div>
            <div class="bubble" th:text="${m.text}"></div>
            <ul class="sources" th:if="${!m.sources.isEmpty()}">
                <li th:each="s : ${m.sources}" th:text="${s}"></li>
            </ul>
        </div>

        <div id="end"></div>
    </div>

    <form class="ask" th:action="@{/chat/ask}" method="post">
        <input type="hidden" name="mode" th:value="${mode.name()}">
        <input type="text" name="question" placeholder="Nhập câu hỏi..." autocomplete="off" required autofocus>
        <button type="submit">Gửi</button>
    </form>

    <form class="footer-actions" th:action="@{/chat/clear-history}" method="post" th:if="${!messages.isEmpty()}">
        <input type="hidden" name="mode" th:value="${mode.name()}">
        <button type="submit" class="secondary">Xoá cuộc trò chuyện này</button>
    </form>
</div>
</body>
</html>
