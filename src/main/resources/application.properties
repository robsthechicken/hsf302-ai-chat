server.port=8080
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.datasource.url=jdbc:h2:file:./data/restaurant;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
ai.chat.provider=groq
ai.chat.api-key=${GROQ_API_KEY:}
ai.chat.model=llama-3.3-70b-versatile
ai.chat.temperature=0.2
ai.chat.base-url=
ai.embedding.provider=gemini
ai.embedding.api-key=${GEMINI_API_KEY:}
ai.embedding.model=gemini-embedding-001
ai.embedding.base-url=
rag.chunk-size=500
rag.chunk-overlap=50
rag.feedback.top-k=5
rag.feedback.min-score=0.4
rag.note.top-k=3
rag.note.min-score=0.4
feedback.max-length=1000
feedback.max-per-window=5
feedback.window-minutes=10
app.seed.enabled=true
