server.port=8080
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Chỉ dùng cookie: không để Tomcat gắn ;jsessionid vào URL (gây 404 ở lần đăng nhập đầu và lộ session ID)
server.servlet.session.tracking-modes=cookie
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# Tomcat mặc định chỉ đọc bỏ 2MB body thừa rồi cắt kết nối -> trình duyệt báo "connection reset"
# thay vì thấy thông báo "File phải nhỏ hơn 5 MB". Đọc bỏ tới 20MB; file lớn hơn nữa vẫn bị cắt (chống gửi body khổng lồ).
server.tomcat.max-swallow-size=20MB
spring.datasource.url=jdbc:h2:file:./data/restaurant;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
ai.chat.provider=groq
ai.chat.api-key=${GROQ_API_KEY:}
# llama-3.3-70b-versatile bị Groq ngừng từ 16/08/2026 (console.groq.com/docs/deprecations); model mới do Groq khuyên dùng:
ai.chat.model=openai/gpt-oss-120b
ai.chat.temperature=0.2
ai.chat.base-url=
ai.embedding.provider=gemini
ai.embedding.api-key=${GEMINI_API_KEY:}
ai.embedding.model=gemini-embedding-001
ai.embedding.base-url=
rag.chunk-size=500
rag.chunk-overlap=50
# Với gemini-embedding-001: nguồn đúng ~0.88-0.93, mục không liên quan vẫn đạt 0.80-0.85 (đo 12/11/2026).
# 0.86 lọc nhiễu; đổi model embedding hoặc dữ liệu -> đo lại.
rag.feedback.top-k=5
rag.feedback.min-score=0.86
rag.note.top-k=3
rag.note.min-score=0.86
feedback.max-length=1000
feedback.max-per-window=5
feedback.window-minutes=10
app.seed.enabled=true
