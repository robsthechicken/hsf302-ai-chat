spring.application.name=ai-chat-web
server.port=8080

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Giới hạn kích thước file upload
# Gemini free tier: 100 embed/phút, mỗi đoạn ~450 ký tự mới -> ~60KB/phút. Để 30KB cho dư.
spring.servlet.multipart.max-file-size=30KB
spring.servlet.multipart.max-request-size=30KB
# Tomcat mặc định chỉ đọc bỏ 2MB body thừa rồi cắt kết nối -> file lớn sẽ không thấy trang báo lỗi.
# -1 = đọc hết; ổn cho app chạy local, deploy thật thì đặt con số cụ thể (vd 10MB).
server.tomcat.max-swallow-size=-1

# ===== Chat model: Groq (đọc key từ biến môi trường GROQ_API_KEY) =====
app.ai.groq.api-key=${GROQ_API_KEY:}
app.ai.groq.base-url=https://api.groq.com/openai/v1
app.ai.groq.model=openai/gpt-oss-120b

# ===== Embedding model: Gemini (đọc key từ biến môi trường GEMINI_API_KEY) =====
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.embedding-model=gemini-embedding-001

# ===== Tham số RAG =====
app.rag.chunk-size=500
app.rag.chunk-overlap=50
app.rag.top-k=3
# đoạn chứa đáp án 0.84-0.92, câu không có đáp án 0.80-0.84 (chồng nhau ở 0.84).
# Đặt hơi thấp để không mất đáp án; câu lọt qua ngưỡng do prompt xử lý. Đổi model/tài liệu -> đo lại.
app.rag.min-score=0.83
